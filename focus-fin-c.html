<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Focus Hourglass</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#191E24;--card:#20252E;--ink:#F0E7DB;--mute:#B9AA97;--ch:#C8AD85;--line:rgba(200,173,133,.25)}
*{box-sizing:border-box;margin:0}html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:Inter,Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:12px;overflow:hidden;font-variant-numeric:lining-nums}
.c{width:100%;max-width:700px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 22px;display:grid;grid-template-columns:auto 1fr;gap:26px;align-items:center}
.k{font:600 10px Inter;letter-spacing:.22em;text-transform:uppercase;color:var(--mute)}
h1{font:italic 500 28px/1.1 "Cormorant Garamond",serif;margin:6px 0 2px}
.big{font:500 48px/1 "Cormorant Garamond",serif;font-variant-numeric:lining-nums tabular-nums;margin:6px 0}
.rule{display:flex;gap:16px;margin:4px 0 10px}.rule span{font-size:12px;color:var(--mute)}.rule b{color:var(--ink);font-weight:600}
button{font:600 11px Inter;letter-spacing:.14em;text-transform:uppercase;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:999px;padding:9px 14px;cursor:pointer}
button[aria-pressed="true"]{border-color:var(--ch);color:var(--ch)}button.go{background:var(--ch);border-color:var(--ch);color:var(--bg)}
button:focus-visible{outline:2px solid var(--ch);outline-offset:2px}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
@media(max-width:480px){.c{grid-template-columns:1fr;justify-items:center;text-align:center}.row,.rule{justify-content:center}}
</style></head><body>
<main class="c" aria-label="Focus timer, hourglass">
<svg width="120" height="200" viewBox="0 0 120 200" role="img" aria-label="Hourglass, sand moves from top to bottom as time passes">
<defs><clipPath id="top"><path d="M22 24 H98 Q98 70 64 96 H56 Q22 70 22 24 Z"/></clipPath><clipPath id="bot"><path d="M56 104 H64 Q98 130 98 176 H22 Q22 130 56 104 Z"/></clipPath></defs>
<rect x="12" y="12" width="96" height="10" rx="3" fill="#C8AD85"/><rect x="12" y="178" width="96" height="10" rx="3" fill="#C8AD85"/>
<line x1="18" y1="22" x2="18" y2="178" stroke="#656F82" stroke-width="3"/><line x1="102" y1="22" x2="102" y2="178" stroke="#656F82" stroke-width="3"/>
<g clip-path="url(#top)"><rect id="st" x="20" y="40" width="80" height="60" fill="#C8AD85"/></g>
<g clip-path="url(#bot)"><path id="sb" fill="#C8AD85"/></g>
<line id="stream" x1="60" y1="96" x2="60" y2="176" stroke="#C8AD85" stroke-width="1.6" opacity="0"/>
<path d="M22 24 H98 Q98 70 64 96 V104 Q98 130 98 176 H22 Q22 130 56 104 V96 Q22 70 22 24 Z" fill="none" stroke="#F0E7DB" stroke-opacity=".7" stroke-width="2"/>
</svg>
<div>
<p class="k">Time is the asset</p>
<h1>Deep work session</h1>
<p class="big" id="t" role="timer">25:00</p>
<div class="rule"><span>Invested today <b id="inv">0 min</b></span><span>Sessions <b id="ss">0</b></span></div>
<div class="row" role="group" aria-label="Session length"><button data-m="25">25 / 5</button><button data-m="50">50 / 10</button><button data-m="90">90 / 15</button></div>
<div class="row"><button class="go" data-go>Begin</button><button data-reset>Reset</button></div>
</div>
<p id="sr" style="position:absolute;width:1px;height:1px;overflow:hidden" aria-live="assertive"></p>
</main>
<script src="timer.js"></script>
<script>
document.querySelector('[data-go]').dataset.start='Begin';
FocusTimer({id:'fin',notes:[587,880],announce:m=>document.getElementById('sr').textContent=m,render(s){
 const f=s.phase==='focus'?s.frac:1-s.frac;
 const topH=(1-f)*58;document.getElementById('st').setAttribute('y',98-topH);document.getElementById('st').setAttribute('height',topH);
 const h=f*60,peak=176-h-Math.min(10,h*.4);document.getElementById('sb').setAttribute('d',`M18 178 L18 ${176-h} Q60 ${peak-8} 102 ${176-h} L102 178 Z`);
 document.getElementById('stream').setAttribute('opacity',s.running&&f<1?.9:0);document.getElementById('stream').setAttribute('y2',176-h);
 document.getElementById('t').textContent=Math.floor(s.left/60)+':'+String(s.left%60).padStart(2,'0');
 document.getElementById('inv').textContent=(s.sessions*s.mode)+' min';document.getElementById('ss').textContent=s.sessions;}});
</script></body></html>
