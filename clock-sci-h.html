<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lab Clock</title>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Source+Serif+4:ital,wght@1,500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}html,body{height:100%}
body{background:#F7F4EC;color:#1F2A2E;font-family:"Courier Prime",monospace;display:flex;align-items:center;justify-content:center;padding:10px;overflow:hidden;
 background-image:repeating-linear-gradient(transparent 0 23px,rgba(36,64,90,.13) 23px 24px)}
.w{display:flex;gap:22px;align-items:center}
h1{font:italic 500 30px/1 "Source Serif 4",serif;color:#24405A}
.k{font-size:11px;letter-spacing:.1em;color:#24405A;margin-top:6px}
@media(max-width:420px){.w{flex-direction:column;gap:8px;text-align:center}}
</style></head><body>
<main class="w" aria-label="Clock">
<svg width="200" height="210" viewBox="0 0 200 210" role="img" aria-label="Laboratory wall clock">
<rect x="90" y="2" width="20" height="12" rx="3" fill="#24405A"/><rect x="82" y="10" width="36" height="6" rx="3" fill="#24405A"/>
<circle cx="100" cy="110" r="92" fill="#FFFFFF" stroke="#24405A" stroke-width="6"/>
<circle cx="100" cy="110" r="82" fill="none" stroke="#24405A" stroke-opacity=".25"/>
<g id="tk"></g>
<text x="100" y="150" text-anchor="middle" font-family="Courier Prime" font-size="9" fill="#24405A" letter-spacing="1">LAB · SEC</text>
<g id="h"><path d="M96 112 L100 62 L104 112 Z" fill="#1F2A2E"/></g>
<g id="m"><path d="M97.5 114 L100 36 L102.5 114 Z" fill="#1F2A2E"/></g>
<g id="s"><line x1="100" y1="130" x2="100" y2="30" stroke="#C0705A" stroke-width="1.5"/><circle cx="100" cy="124" r="4" fill="#C0705A"/></g>
<circle cx="100" cy="110" r="4" fill="#1F2A2E"/>
</svg>
<div><p class="k">Observed at</p><h1 id="dg">00:00</h1><p class="k" id="dt"></p></div>
</main>
<script src="clocks.js"></script>
<script>
let o='';for(let i=0;i<60;i++){const a=i*6*Math.PI/180,r2=i%5?78:70;o+=`<line x1="${100+84*Math.sin(a)}" y1="${110-84*Math.cos(a)}" x2="${100+r2*Math.sin(a)}" y2="${110-r2*Math.cos(a)}" stroke="#24405A" stroke-width="${i%5?1:2.2}"/>`;
 if(i%5===0)o+=`<text x="${100+60*Math.sin(a)}" y="${110-60*Math.cos(a)+4}" text-anchor="middle" font-family="Courier Prime" font-weight="700" font-size="12" fill="#24405A">${i?i/5:12}</text>`;}
document.getElementById('tk').innerHTML=o;
function t(){const d=new Date(),a=handAngles(d);a.s=Math.floor(d.getSeconds())*6;['h','m','s'].forEach(k=>document.getElementById(k).setAttribute('transform',`rotate(${a[k]} 100 110)`));
 document.getElementById('dg').textContent=d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});document.getElementById('dt').textContent=dateLine(d);}
t();setInterval(t,250);
</script></body></html>
