<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Focus Build</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0D0F0C;--a:#00FFF8;--o:#D2E8E9}
*{box-sizing:border-box;margin:0}html,body{height:100%}
body{background:var(--bg);color:var(--a);font:13px/1.5 "JetBrains Mono",monospace;display:flex;align-items:center;justify-content:center;padding:12px;overflow:hidden}
.term{width:100%;max-width:700px;border:1px solid rgba(0,255,248,.35);border-radius:8px;overflow:hidden;background:#0B0C0A;box-shadow:0 0 30px rgba(0,255,248,.06) inset}
.bar{display:flex;align-items:center;gap:6px;padding:7px 10px;border-bottom:1px solid rgba(0,255,248,.2);color:rgba(0,255,248,.7);font-size:11px}
.bar i{width:9px;height:9px;border-radius:50%;background:rgba(0,255,248,.35)}
.body{padding:12px 14px;text-shadow:0 0 6px rgba(0,255,248,.35)}
.dim{opacity:.55}.o{color:var(--o)}
#log{height:66px;overflow:hidden;white-space:pre}
.big{font:600 34px/1 "JetBrains Mono";margin:6px 0;color:var(--o)}
.cur{display:inline-block;width:8px;height:15px;background:var(--a);vertical-align:-2px;animation:b 1s steps(1) infinite}
@keyframes b{50%{opacity:0}}
button{font:600 12px "JetBrains Mono";color:var(--a);background:transparent;border:1px solid rgba(0,255,248,.5);border-radius:4px;padding:5px 10px;cursor:pointer}
button[aria-pressed="true"],button.go{background:var(--a);color:var(--bg)}
button:focus-visible{outline:2px solid var(--o);outline-offset:2px}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
@media (prefers-reduced-motion:reduce){.cur{animation:none}}
</style></head><body>
<main class="term" aria-label="Focus timer, terminal">
<div class="bar"><i></i><i></i><i></i><span style="margin-left:6px">~/study — focus.sh</span></div>
<div class="body">
<div><span class="dim">$</span> ./focus.sh --minutes <span id="mm">25</span> <span class="cur"></span></div>
<div id="log" aria-hidden="true"></div>
<div class="big" id="t" role="timer">25:00</div>
<div id="pb">[··································] 0%</div>
<div class="row" role="group" aria-label="Session length"><button data-m="25">--25</button><button data-m="50">--50</button><button data-m="90">--90</button>
<button class="go" data-go data-start="run" data-pause="pause">run</button><button data-reset>reset</button></div>
</div>
<p id="sr" style="position:absolute;width:1px;height:1px;overflow:hidden" aria-live="assertive"></p>
</main>
<script src="timer.js"></script>
<script>
const LINES=['loading notes ............ ok','muting notifications ..... ok','compiling ideas .......... ok','linking concepts ......... ok','running practice set ..... ok','refactoring mistakes ..... ok','writing summary .......... ok'];
let shown=-1;const log=document.getElementById('log');
FocusTimer({id:'tech',wave:'square',notes:[440,660],announce:m=>document.getElementById('sr').textContent=m,render(s){
 const n=34,k=Math.round(s.frac*n);document.getElementById('pb').textContent='['+'#'.repeat(k)+'·'.repeat(n-k)+'] '+Math.round(s.frac*100)+'%'+(s.phase==='break'?'  (break)':'');
 document.getElementById('t').textContent=Math.floor(s.left/60)+':'+String(s.left%60).padStart(2,'0');document.getElementById('mm').textContent=s.mode;
 const idx=s.phase==='focus'?Math.min(LINES.length-1,Math.floor(s.frac*LINES.length)):-1;
 if(!s.running&&s.frac===0){log.innerHTML='<span class="dim">ready. sessions today: '+s.sessions+'</span>';shown=-1;}
 else if(idx!==shown){shown=idx;log.textContent=s.phase==='focus'?LINES.slice(Math.max(0,idx-2),idx+1).map(l=>'> '+l).join('\n'):'> break: step away from the screen\n> sessions today: '+s.sessions;}}});
</script></body></html>
