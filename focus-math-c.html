<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Focus Integral</title>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bd:#1D202A;--ch:#ECEAE1;--y:#F2C14E}
*{box-sizing:border-box;margin:0}html,body{height:100%}
body{background:var(--bd);color:var(--ch);font-family:Kalam,cursive;display:flex;align-items:center;justify-content:center;padding:12px;overflow:hidden;
 background-image:radial-gradient(ellipse at 30% 20%,rgba(255,255,255,.05),transparent 60%)}
.b{width:100%;max-width:700px;display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
h1{font:700 26px/1.1 Kalam}
.eq{font-size:17px;opacity:.85;margin:4px 0}
.big{font:700 40px/1 Kalam;color:var(--y)}
button{font:700 14px Kalam;color:var(--ch);background:transparent;border:2px solid rgba(236,234,225,.6);border-radius:18px 14px 20px 12px;padding:4px 12px;cursor:pointer}
button[aria-pressed="true"],button.go{border-color:var(--y);color:var(--y)}
button:focus-visible{outline:2px dashed var(--y);outline-offset:3px}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
svg text{font-family:Kalam;fill:var(--ch)}
@media(max-width:480px){.b{grid-template-columns:1fr;justify-items:center;text-align:center}.row{justify-content:center}}
</style></head><body>
<main class="b" aria-label="Focus timer, integral">
<svg width="230" height="190" viewBox="0 0 230 190" role="img" aria-label="Area under a curve fills in as time passes">
<defs><filter id="chalk"><feTurbulence baseFrequency=".9" numOctaves="2" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2"/></filter>
<clipPath id="cp"><rect id="cr" x="20" y="0" width="0" height="190"/></clipPath></defs>
<g filter="url(#chalk)">
<line x1="14" y1="160" x2="222" y2="160" stroke="#ECEAE1" stroke-width="2.4"/><line x1="20" y1="170" x2="20" y2="14" stroke="#ECEAE1" stroke-width="2.4"/>
<path id="area" fill="#F2C14E" fill-opacity=".28" clip-path="url(#cp)"/>
<path id="curve" fill="none" stroke="#ECEAE1" stroke-width="3"/>
<line id="cut" x1="20" y1="160" x2="20" y2="30" stroke="#F2C14E" stroke-width="2" stroke-dasharray="5 5"/>
<text x="20" y="182" font-size="14" text-anchor="middle">0</text><text x="210" y="182" font-size="14" text-anchor="middle" id="tl">25</text>
<text x="216" y="152" font-size="15">t</text></g>
</svg>
<div>
<h1>Focus, integrated</h1>
<p class="eq" id="eq">∫₀ᵗ focus dt</p>
<p class="big" id="t" role="timer">25:00</p>
<p class="eq" id="pr">Σ sessions today = 0</p>
<div class="row" role="group" aria-label="Session length"><button data-m="25">25 / 5</button><button data-m="50">50 / 10</button><button data-m="90">90 / 15</button></div>
<div class="row"><button class="go" data-go>Start</button><button data-reset>Reset</button></div>
</div>
<p id="sr" style="position:absolute;width:1px;height:1px;overflow:hidden" aria-live="assertive"></p>
</main>
<script src="timer.js"></script>
<script>
const f=x=>160-(28+60*x+40*Math.sin(x*5.2)*x*.6+30*x*x); // smooth rising curve on [0,1]
let c='',a='M20 160';for(let i=0;i<=100;i++){const x=i/100,X=20+x*190,Y=f(x);c+=(i?'L':'M')+X.toFixed(1)+' '+Y.toFixed(1);a+=' L'+X.toFixed(1)+' '+Y.toFixed(1);}
document.getElementById('curve').setAttribute('d',c);document.getElementById('area').setAttribute('d',a+' L210 160 Z');
FocusTimer({id:'math',notes:[523,659,784],announce:m=>document.getElementById('sr').textContent=m,render(s){
 const x=s.frac,X=20+x*190;document.getElementById('cr').setAttribute('width',x*190);
 const cut=document.getElementById('cut');cut.setAttribute('x1',X);cut.setAttribute('x2',X);cut.setAttribute('y2',f(x));
 document.getElementById('tl').textContent=s.total/60;
 document.getElementById('t').textContent=Math.floor(s.left/60)+':'+String(s.left%60).padStart(2,'0');
 const done=Math.round((s.total-s.left)/60);
 document.getElementById('eq').textContent=s.phase==='focus'?`∫₀ᵗ focus dt,  t = ${done} of ${s.total/60} min`:'lim break → 0  (rest)';
 document.getElementById('pr').textContent='Σ sessions today = '+s.sessions;}});
</script></body></html>
