<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Focus Monitor</title>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--s:#F0E8E9;--n:#1E5249;--c:#E05F94;--ct:#B0376B}
*{box-sizing:border-box;margin:0}html,body{height:100%}
body{background:var(--s);color:var(--n);font-family:"Public Sans",sans-serif;display:flex;align-items:center;justify-content:center;padding:12px;overflow:hidden;
 background-image:radial-gradient(rgba(30,82,73,.12) 1px,transparent 1px);background-size:14px 14px}
.m{width:100%;max-width:700px;background:#fff;border:1px solid rgba(30,82,73,.18);border-left:5px solid var(--c);border-radius:12px;padding:14px 18px}
.top{display:flex;justify-content:space-between;align-items:center}
.k{font:700 10px "Public Sans";letter-spacing:.2em;text-transform:uppercase;color:rgba(30,82,73,.7)}
.live{font:700 10px "Public Sans";letter-spacing:.16em;color:var(--ct)}.live i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--c);margin-right:5px;vertical-align:1px}
.grid{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;margin-top:6px}
canvas{width:100%;height:90px;display:block;background:#FAF6F6;border-radius:8px}
.big{font:700 44px/1 "Public Sans";font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.v{display:flex;gap:18px;margin-top:4px}.v span{font-size:12px;color:rgba(30,82,73,.75)}.v b{display:block;font-size:18px;color:var(--n)}
button{font:700 11px "Public Sans";letter-spacing:.12em;text-transform:uppercase;color:var(--n);background:#fff;border:1.5px solid rgba(30,82,73,.35);border-radius:8px;padding:7px 11px;cursor:pointer}
button[aria-pressed="true"]{border-color:var(--c);color:var(--ct)}button.go{background:var(--n);border-color:var(--n);color:#fff}
button:focus-visible{outline:2px solid var(--c);outline-offset:2px}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
@media(max-width:480px){.grid{grid-template-columns:1fr}}
</style></head><body>
<main class="m" aria-label="Focus timer, vitals monitor">
<div class="top"><p class="k">Study shift · focus monitor</p><p class="live" id="lv"><i></i>STANDBY</p></div>
<div class="grid">
<canvas id="cv" width="520" height="90" aria-hidden="true"></canvas>
<div><p class="k">Remaining</p><p class="big" id="t" role="timer">25:00</p></div>
</div>
<div class="v"><span>Phase<b id="ph">Focus</b></span><span>Rounds today<b id="ss">0</b></span><span>Progress<b id="pc">0%</b></span></div>
<div class="row" role="group" aria-label="Session length"><button data-m="25">25 / 5</button><button data-m="50">50 / 10</button><button data-m="90">90 / 15</button>
<button class="go" data-go data-start="Start shift" data-pause="Pause">Start shift</button><button data-reset>Reset</button></div>
<p id="sr" style="position:absolute;width:1px;height:1px;overflow:hidden" aria-live="assertive"></p>
</main>
<script src="timer.js"></script>
<script>
const cv=document.getElementById('cv'),x=cv.getContext('2d');let run=false,phase='focus',pos=0;const W=cv.width,H=cv.height,mid=H*.6,buf=new Array(W).fill(mid);
// one P-QRS-T beat shape, used as a decorative "this timer is running" signal
function beat(u){if(u<.08)return -6*Math.sin(u/.08*Math.PI);if(u<.14)return 0;if(u<.16)return 6;if(u<.19)return -38;if(u<.22)return 14;if(u<.32)return 0;if(u<.44)return -10*Math.sin((u-.32)/.12*Math.PI);return 0;}
let t0=performance.now();
function frame(now){const per=phase==='focus'?900:1400;for(let i=0;i<3;i++){pos=(pos+1)%W;const u=((now+i*5)%per)/per;buf[pos]=run?mid+beat(u):mid;}
 x.clearRect(0,0,W,H);x.strokeStyle='rgba(30,82,73,.08)';for(let gx=0;gx<W;gx+=20){x.beginPath();x.moveTo(gx,0);x.lineTo(gx,H);x.stroke();}
 x.strokeStyle=run?'#E05F94':'rgba(30,82,73,.35)';x.lineWidth=2;x.beginPath();for(let i=1;i<=W;i++){const j=(pos+i)%W;i===1?x.moveTo(0,buf[j]):x.lineTo(i-1,buf[j]);}x.stroke();
 if(!matchMedia('(prefers-reduced-motion: reduce)').matches)requestAnimationFrame(frame);}
requestAnimationFrame(frame);
FocusTimer({id:'med',notes:[784,784,1046],announce:m=>document.getElementById('sr').textContent=m,render(s){run=s.running;phase=s.phase;
 document.getElementById('t').textContent=Math.floor(s.left/60)+':'+String(s.left%60).padStart(2,'0');
 document.getElementById('ph').textContent=s.phase==='focus'?'Focus':'Rest';document.getElementById('ss').textContent=s.sessions;document.getElementById('pc').textContent=Math.round(s.frac*100)+'%';
 document.getElementById('lv').innerHTML='<i></i>'+(s.running?(s.phase==='focus'?'ON SHIFT':'ON BREAK'):'STANDBY');}});
</script></body></html>
