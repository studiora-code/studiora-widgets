<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Unit Circle Clock</title>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}html,body{height:100%}
body{background:#1D202A;color:#ECEAE1;font-family:Kalam,cursive;display:flex;align-items:center;justify-content:center;padding:10px;overflow:hidden}
.w{display:flex;gap:20px;align-items:center}
h1{font:700 34px/1 Kalam}.k{font-size:15px;opacity:.85;margin-top:4px}.y{color:#F2C14E}
svg text{font-family:Kalam;fill:#ECEAE1}
@media(max-width:420px){.w{flex-direction:column;gap:6px;text-align:center}}
</style></head><body>
<main class="w" aria-label="Clock">
<svg width="210" height="210" viewBox="0 0 210 210" role="img" aria-label="Unit circle clock">
<defs><filter id="ch"><feTurbulence baseFrequency=".9" numOctaves="2"/><feDisplacementMap in="SourceGraphic" scale="1.8"/></filter></defs>
<g filter="url(#ch)">
<line x1="10" y1="105" x2="200" y2="105" stroke="#ECEAE1" stroke-opacity=".5" stroke-width="1.6"/><line x1="105" y1="10" x2="105" y2="200" stroke="#ECEAE1" stroke-opacity=".5" stroke-width="1.6"/>
<circle cx="105" cy="105" r="80" fill="none" stroke="#ECEAE1" stroke-width="2.4"/>
<text x="190" y="98" font-size="13">0</text><text x="110" y="20" font-size="13">π/2</text><text x="12" y="98" font-size="13">π</text><text x="110" y="198" font-size="13">3π/2</text>
<path id="arc" fill="#F2C14E" fill-opacity=".18" stroke="#F2C14E" stroke-width="1.5"/>
<line id="h" x1="105" y1="105" stroke="#ECEAE1" stroke-width="4" stroke-linecap="round"/>
<line id="m" x1="105" y1="105" stroke="#F2C14E" stroke-width="2.6" stroke-linecap="round"/>
<circle id="md" r="4" fill="#F2C14E"/>
</g></svg>
<div><h1 id="dg">00:00</h1><p class="k">minute hand θ = <span class="y" id="th">0</span></p><p class="k" id="dt"></p></div>
</main>
<script src="clocks.js"></script>
<script>
// standard position: angle measured counterclockwise from +x. Minute hand pointing at 12 is π/2.
function frac(n){const g=(a,b)=>b?g(b,a%b):a;const d=30,k=g(n,d);return [n/k,d/k];}
function t(){const d=new Date(),a=handAngles(d);
 const P=(deg,r)=>{const rad=(deg-90)*Math.PI/180;return [105+r*Math.cos(rad),105+r*Math.sin(rad)];};
 const [hx,hy]=P(a.h,46),[mx,my]=P(a.m,74);
 const h=document.getElementById('h'),m=document.getElementById('m');h.setAttribute('x2',hx);h.setAttribute('y2',hy);m.setAttribute('x2',mx);m.setAttribute('y2',my);
 const md=document.getElementById('md');md.setAttribute('cx',mx);md.setAttribute('cy',my);
 // θ in standard position, rounded to whole minutes: θ = π/2 − 2π·(min/60), kept in [0, 2π)
 const mins=d.getMinutes(); let n=(15-mins+60)%60; // θ = n·(π/30)
 const [p,q]=frac(n*1);let s=n===0?'0':(p===1?'':p)+'π'+(q===1?'':'/'+q);
 document.getElementById('th').textContent=s;
 const r=24,end=(-n*6);const big=n>30?1:0;const ex=105+r*Math.cos(end*Math.PI/180),ey=105+r*Math.sin(end*Math.PI/180);
 document.getElementById('arc').setAttribute('d',n===0?'':`M105 105 L129 105 A${r} ${r} 0 ${big} 0 ${ex.toFixed(2)} ${ey.toFixed(2)} Z`);
 document.getElementById('dg').textContent=d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});document.getElementById('dt').textContent=dateLine(d);}
t();setInterval(t,1000);
</script></body></html>
