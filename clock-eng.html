<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Blueprint Clock</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}html,body{height:100%}
body{background:#123A6B;color:#EEF3F8;font-family:"IBM Plex Mono",monospace;display:flex;align-items:center;justify-content:center;padding:10px;overflow:hidden;
 background-image:linear-gradient(rgba(238,243,248,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(238,243,248,.07) 1px,transparent 1px);background-size:16px 16px}
.w{display:flex;gap:22px;align-items:center}
svg text{font-family:"IBM Plex Mono";fill:#EEF3F8}
h1{font:600 30px/1 "Barlow Condensed";letter-spacing:.08em}
.k{font-size:10px;letter-spacing:.18em;text-transform:uppercase;opacity:.7;margin-top:6px}
@media(max-width:420px){.w{flex-direction:column;gap:8px;text-align:center}}
</style></head><body>
<main class="w" aria-label="Clock">
<svg width="200" height="200" viewBox="0 0 200 200" role="img" aria-label="Analog clock">
<circle cx="100" cy="100" r="94" fill="none" stroke="#EEF3F8" stroke-opacity=".5" stroke-dasharray="26 5 3 5"/>
<circle cx="100" cy="100" r="84" fill="#0D2C55" stroke="#EEF3F8" stroke-width="1.6"/>
<g id="tk"></g>
<line x1="100" y1="2" x2="100" y2="198" stroke="#EEF3F8" stroke-opacity=".25" stroke-dasharray="14 4 2 4"/><line x1="2" y1="100" x2="198" y2="100" stroke="#EEF3F8" stroke-opacity=".25" stroke-dasharray="14 4 2 4"/>
<g id="h"><rect x="97" y="54" width="6" height="52" fill="#EEF3F8"/></g>
<g id="m"><rect x="98.5" y="26" width="3" height="80" fill="#EEF3F8"/></g>
<g id="s"><line x1="100" y1="118" x2="100" y2="22" stroke="#F26A1B" stroke-width="1.5"/><circle cx="100" cy="22" r="3" fill="none" stroke="#F26A1B"/></g>
<circle cx="100" cy="100" r="6" fill="#123A6B" stroke="#EEF3F8" stroke-width="2"/>
</svg>
<div><p class="k">Local time · scale 1:1</p><h1 id="dg">00:00</h1><p class="k" id="dt"></p></div>
</main>
<script src="clocks.js"></script>
<script>
let o='';for(let i=0;i<60;i++){const a=i*6*Math.PI/180,r2=i%5?79:72;o+=`<line x1="${100+84*Math.sin(a)}" y1="${100-84*Math.cos(a)}" x2="${100+r2*Math.sin(a)}" y2="${100-r2*Math.cos(a)}" stroke="#EEF3F8" stroke-width="${i%5?.8:1.8}" stroke-opacity="${i%5?.5:1}"/>`;
 if(i%15===0)o+=`<text x="${100+60*Math.sin(a)}" y="${100-60*Math.cos(a)+4}" text-anchor="middle" font-size="11">${i?i/5:12}</text>`;}
document.getElementById('tk').innerHTML=o;
function t(){const d=new Date(),a=handAngles(d);['h','m','s'].forEach(k=>document.getElementById(k).setAttribute('transform',`rotate(${a[k]} 100 100)`));
 document.getElementById('dg').textContent=d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});document.getElementById('dt').textContent=dateLine(d);requestAnimationFrame(t);}
t();
</script></body></html>
